<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>IT Seminar Registration</h1>

  <form id="registrationForm">
    <div class="form-group">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" name="fullName" aria-describedby="fullNameError">
      <span id="fullNameError" class="error" role="alert"></span>
    </div>

    <div class="form-group">
      <label for="studentNumber">Student Number</label>
      <input type="text" id="studentNumber" name="studentNumber" aria-describedby="studentNumberError">
      <span id="studentNumberError" class="error" role="alert"></span>
    </div>

    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" name="email" aria-describedby="emailError">
      <span id="emailError" class="error" role="alert"></span>
    </div>

    <div class="form-group">
      <label for="mobileNumber">Mobile Number</label>
      <input type="tel" id="mobileNumber" name="mobileNumber" aria-describedby="mobileNumberError">
      <span id="mobileNumberError" class="error" role="alert"></span>
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" aria-describedby="passwordError passwordFeedback">
      <span id="passwordError" class="error" role="alert"></span>
      <p id="passwordFeedback" class="feedback"></p>
    </div>

    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" aria-describedby="confirmPasswordError">
      <span id="confirmPasswordError" class="error" role="alert"></span>
    </div>

    <div class="form-group">
      <label for="course">Course</label>
      <select id="course" name="course" aria-describedby="courseError">
        <option value="">Select your course</option>
        <option value="BSIT">BSIT</option>
        <option value="BSCS">BSCS</option>
      </select>
      <span id="courseError" class="error" role="alert"></span>
    </div>

    <div class="form-group checkbox-group">
      <input type="checkbox" id="terms" name="terms" aria-describedby="termsError">
      <label for="terms">I agree to the terms and conditions</label>
      <span id="termsError" class="error" role="alert"></span>
    </div>

    <div class="button-group">
      <button type="submit" id="registerBtn">Register</button>
      <button type="reset" id="resetBtn">Reset</button>
    </div>

    <div id="successMessage" class="success"></div>

    <div id="registrationSummary" class="summary">
      <h3>Registration Summary</h3>
      <p><strong>Full Name:</strong> <span id="summaryName"></span></p>
      <p><strong>Student Number:</strong> <span id="summaryStudentNumber"></span></p>
      <p><strong>Email:</strong> <span id="summaryEmail"></span></p>
      <p><strong>Mobile Number:</strong> <span id="summaryMobileNumber"></span></p>
      <p><strong>Course:</strong> <span id="summaryCourse"></span></p>
    </div>
  </form>

  <script src="js/app.js"></script>
</body>
</html>
